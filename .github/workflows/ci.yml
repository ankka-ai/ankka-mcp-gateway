name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gates of `npm run check` run as parallel jobs on one cached module
# tree. The final `check` job is the required status on main; it passes only
# when every gate passed, or the exact merged tree already passed this workflow
# on its PR. PRs always run the full gate; missing evidence also runs it in full.
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules-key: ${{ steps.key.outputs.key }}
      reused: ${{ steps.source.outputs.reused }}
      reused-history: ${{ steps.reused-history.outcome }}
      source-commit: ${{ steps.source.outputs.source-commit }}
      source-tree: ${{ steps.source.outputs.source-tree }}
    steps:
      # Push to main needs full history so a reused merge runs check:history
      # directly here instead of spinning up a second runner.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:toolchain
      - id: source
        name: Check for identical PR validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-pr-check.mjs
      - id: key
        run: echo "key=node-modules-v1-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ steps.key.outputs.key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - id: reused-history
        name: Verify boundary and history for reused merge
        if: steps.source.outputs.reused == 'true'
        run: |
          npm run check:boundary
          npm run check:history

  lint-typecheck:
    needs: install
    if: needs.install.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ needs.install.outputs.modules-key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check:toolchain
      - run: npm run lint
      - run: npm run typecheck

  # Rebalanced 2026-11-22 from measured PR timings: admin tests (~50 s) run on
  # their own runner separately from build + non-admin workspace suites (~34 s),
  # and the single-worker installer rest suite (~75 s) splits across two shards
  # (~38 s each) alongside the two slowest installer files (~49 s). Excluding
  # the slowest pair from the sharded rest legs ensures every new installer
  # test file always runs; renaming either excluded file fails installer-slowest.
  app-tests:
    name: app-tests (${{ matrix.part }})
    needs: install
    if: needs.install.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [apps-other, admin, installer-slowest, installer-rest-1, installer-rest-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ needs.install.outputs.modules-key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check:toolchain
      - if: matrix.part == 'apps-other'
        run: |
          npm run build
          npm run test --workspace @ankka/api-source-runtime
          npm run test --workspace @ankka/read-only-connectors
          npm run test --workspace @ankka/search-console-adapter
          npm run test:runtime
      - if: matrix.part == 'admin'
        run: npm run test --workspace @ankka/gateway-admin
      - if: matrix.part == 'installer-slowest'
        run: >-
          npm run test --workspace @ankka/gateway-installer --
          test/customer-bigquery-teardown-runtime.test.mjs
          test/customer-stage2-converger.test.ts
      - if: matrix.part == 'installer-rest-1'
        run: >-
          npm run test --workspace @ankka/gateway-installer --
          --exclude test/customer-bigquery-teardown-runtime.test.mjs
          --exclude test/customer-stage2-converger.test.ts
          --shard=1/2
      - if: matrix.part == 'installer-rest-2'
        run: >-
          npm run test --workspace @ankka/gateway-installer --
          --exclude test/customer-bigquery-teardown-runtime.test.mjs
          --exclude test/customer-stage2-converger.test.ts
          --shard=2/2

  core-tests:
    needs: install
    if: needs.install.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ needs.install.outputs.modules-key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check:toolchain
      - run: npm run build:admin
      - run: npm run test:core

  boundary-history:
    needs: install
    if: needs.install.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ needs.install.outputs.modules-key }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run check:toolchain
      - run: npm run check:boundary
      - run: npm run check:history

  check:
    needs: [install, lint-typecheck, app-tests, core-tests, boundary-history]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REUSED: ${{ needs.install.outputs.reused }}
          INSTALL_RESULT: ${{ needs.install.result }}
          REUSED_HISTORY_RESULT: ${{ needs.install.outputs.reused-history }}
        run: |
          echo "gate results: $RESULTS"
          if [ "$REUSED" = "true" ]; then
            if [ "$INSTALL_RESULT" != "success" ] || [ "$REUSED_HISTORY_RESULT" != "success" ]; then
              echo "reused gate did not verify boundary and history"
              exit 1
            fi
            for result in $RESULTS; do
              if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                exit 1
              fi
            done
            echo "The exact merged source already passed the full PR gate."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a gate did not pass"
              exit 1
            fi
          done
      - name: Record the source that passed every gate
        if: needs.install.outputs.reused != 'true'
        env:
          TESTED_COMMIT: ${{ needs.install.outputs.source-commit }}
          TESTED_TREE: ${{ needs.install.outputs.source-tree }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('checked-source.json', JSON.stringify({
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            testedCommit: process.env.TESTED_COMMIT,
            tree: process.env.TESTED_TREE,
          }));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.install.outputs.reused != 'true'
        with:
          name: checked-source-${{ github.run_attempt }}
          path: checked-source.json
          retention-days: 7
          if-no-files-found: error
